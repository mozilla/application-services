[package]
name = "encryption"
version = "0.1.0"
edition = "2021"
authors = ["Naomi Kirby <nkirby@mozilla.com>"]
license = "MPL-2.0"

[features]
default = []
# Enables `NSSKeyManager`, which stores the logins encryption key in NSS's
# `key4.db` (wrapped with a key derived from the primary password, if set).
# Used on Desktop to integrate with the existing NSS key store and primary
# password flow.
keydb = ["nss-as/keydb", "dep:async-trait", "dep:futures"]

[dependencies]
uniffi = { version = "0.31" }
anyhow = "1.0"
async-trait = { version = "0.1", optional = true }
error-support = { path = "../error" }
futures = { version = "0.3", optional = true, features = ["executor"] }
jwcrypto = { path = "../jwcrypto" }
nss-as = { path = "../rc_crypto/nss", default-features = false }
serde_json = "1"
parking_lot = ">=0.11,<=0.12"

thiserror = "2"

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }
