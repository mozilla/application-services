[package]
name = "viaduct-backend-rust"
version = "0.2.0"
authors = ["Sync Team <sync-team@mozilla.com>"]
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["lib"]

[dependencies]
async-trait = "0.1"
error-support = { path = "../error" }
tokio = { version = "1", features = ["rt-multi-thread"] }
viaduct = { path = "../../viaduct" }
reqwest = { version = "0.11", features = ["native-tls-vendored"] }
uniffi = { version = "0.32" }
url = "2"
