[package]
name = "metrics-support"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
autotests = false

[dependencies]
anyhow = "1"
glean = { version = "71", optional = true }
glean-sym = { version = "71" }

[build-dependencies]
glean-build = { git = "https://github.com/mozilla/glean", tag = "v71.0.0" }

[features]
# Use Firefox-on-Glean to publish metrics (Desktop)
fog = ["dep:glean"]
